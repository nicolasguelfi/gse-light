# Template for .github/workflows/gates.yml in a product repository (Day-0 CI).
# Rule (reference design ch. 8): CI runs exactly the local gates command (./gates.sh), nothing else.
# Day 0: ./gates.sh is a stub that prints "no gates yet" and exits 0, so this workflow is green
# on an empty repository. Services and extra branches: fill after the design phase from the DD
# records (stack, repository layout, environments) — in the same commit as gates.sh.
name: gates

on:
  pull_request:
  push:
    branches: [main]   # extra branches: fill after the design phase from the DD records

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # services (database, queue…): fill after the design phase from the DD records
    steps:
      - uses: actions/checkout@v5
      # toolchain setup (language runtime, package manager): fill after the design phase from the DD records
      - name: All gates (identical to the local command)
        run: ./gates.sh
