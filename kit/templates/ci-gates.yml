# Template for .github/workflows/gates.yml in a product repository (Day-0 CI).
# Rule (reference design ch. 8): CI runs exactly the local gates command (bash ./gates.sh),
# nothing else. "bash ./gates.sh" rather than "./gates.sh": the script then runs even when it
# was committed without the executable bit (a Git Bash clone on Windows does that).
# Day 0: gates.sh is a stub that prints "no gates yet" and exits 0, so this workflow is green
# on an empty repository. Services, toolchain and extra branches: fill after the design phase
# from its design decisions (DD records — the twelve design decisions of the kit skill `design-phase`, in order:
# environments and promotion path, stack and language, data store, continuous integration) —
# in the same commit as gates.sh.
name: gates

# Minutes (the method's owner, 2026-10-29): a change of the project's record only — meetings, journal,
# cockpit, governance, planning — or of the kit's .claude/ runs no gates: no gate reads them, and
# review.yml still checks the documents. The requirements and the design are NOT left out: the
# requirement-to-test map and the tests read them. A project whose code reads one of the paths below
# removes it from both lists. A draft pull request waits until it is ready for review; a newer push
# cancels the run it makes obsolete.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["project/meetings/**", "project/journal/**", "project/BRIEFING.md", "project/governance/**", "project/planning/**", ".claude/**"]
  push:
    branches: [main]   # extra branches: fill after the design phase from the environments and promotion path decision
    paths-ignore: ["project/meetings/**", "project/journal/**", "project/BRIEFING.md", "project/governance/**", "project/planning/**", ".claude/**"]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.pull_request.number || github.sha }}   # main: one group per commit, never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a run of main

jobs:
  gates:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # services (database, queue…): fill after the design phase from the data store decision
    steps:
      - uses: actions/checkout@v5
      # toolchain setup (language runtime, package manager): fill after the design phase from the stack and language decision
      - name: All gates (identical to the local command)
        run: bash ./gates.sh
