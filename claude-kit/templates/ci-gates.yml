# Template for .github/workflows/gates.yml in a product repository.
# Rule (reference design ch. 8): CI runs exactly the local gates command, nothing else.
# Replace <…> once the stack is chosen (the instance's stack decision).
name: gates

on:
  pull_request:
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      # <toolchain setup, e.g. astral-sh/setup-uv for Python>
      - name: All gates (identical to the local command)
        run: <make gates>
