<!doctype html>
<!-- Shortcut to a claude.ai artifact: double-click in the file explorer to open it.
     Copy as `open.html` into the artifact's folder and replace {{TITLE}} and {{URL}} (both places). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta http-equiv="refresh" content="0; url={{URL}}">
</head>
<body style="font-family: sans-serif; padding: 2rem">
<p>Opening <a href="{{URL}}">{{TITLE}}</a> on claude.ai…</p>
<p>If nothing happens, click the link. The artifact is private until its owner shares it.</p>
</body>
</html>
