# Documentation gates of the project's repository (template for .github/workflows/docs.yml): the
# registers and links of project/, its copy of the kit, and the leak guard on gse-light
# (project/private-terms.txt). gse-light is checked out at the commit recorded in
# .claude/KIT_VERSION (written by kit/install.sh), so a newer kit on GitHub never turns this
# repository's CI red by itself: the copies of the skills are compared with the version they
# were installed from, and a copy the team changed is a warning, never a failure. Full history (fetch-depth 0): the short hash resolves, and the leak guard
# reads every commit message.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo
      - name: Read the installed kit version
        id: kit
        run: echo "ref=$(tr -d '[:space:]' < repo/.claude/KIT_VERSION 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: nicolasguelfi/gse-light   # public; a private copy would need a token
          path: gse-light
          fetch-depth: 0
      - name: gse-light at the installed kit version
        env:
          REF: ${{ steps.kit.outputs.ref }}
        run: |
          # actions/checkout takes a branch, a tag or a full 40-character SHA, not the short hash
          # that install.sh records: resolve it here, after the full fetch
          if [ -n "$REF" ] && git -C gse-light cat-file -e "$REF^{commit}" 2>/dev/null; then
            git -C gse-light checkout -q --detach "$REF"
            echo "gse-light at $REF (the version the kit was installed from)"
          else
            echo "::warning::.claude/KIT_VERSION missing or unknown in gse-light ('$REF'): checking against its main branch — refresh the kit with ../gse-light/kit/install.sh"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Documentation gates (same as local)
        working-directory: repo
        run: python3 ../gse-light/scripts/check_docs.py
